# =============================================================
# docker-compose.yml — ROS2 Jazzy Desktop
# =============================================================
services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros2_jazzy_desktop:latest
    container_name: ros2_jazzy

    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    volumes:
      # Source code — live-edit without rebuilding the image
      - ./:/ros2_ws/src/

      # X11 socket for GUI tools
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # Persist colcon build/install/log between container restarts
      - ros2_build:/ros2_ws/src/build
      - ros2_install:/ros2_ws/src/install
      - ros2_log:/ros2_ws/src/log

    # Host network for ROS2 DDS discovery
    network_mode: host

    stdin_open: true
    tty: true

    # privileged: true   # uncomment for GPU / hardware access

    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ros2_build:
  ros2_install:
  ros2_log:
