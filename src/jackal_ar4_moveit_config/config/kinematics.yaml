ar4_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  # Timeout per IK attempt. KDL is a numerical solver that needs random
  # restarts for challenging poses (e.g. behind-the-base, near-singular).
  # 0.005 s (the previous value) is enough for trivial forward reaches but
  # causes "Unable to sample any valid states for goal tree" for constrained
  # poses at the edge of the workspace. 0.1 s gives 100 ms per attempt —
  # sufficient for the full AR4 workspace including the rear-bin position.
  kinematics_solver_timeout: 0.1
  # Number of random-restart attempts KDL makes per IK call.
  # More attempts improve coverage of difficult regions (negative Z, behind-base)
  # at the cost of slightly longer planning time for easy poses.
  kinematics_solver_attempts: 10
  # KDL Newton-Raphson convergence threshold (metres / radians).
  # Default is 1e-5 (10 µm). Tighter values make the solver reject near-solutions
  # in difficult configurations (negative Z, behind-base, near-singular).
  # 1e-3 (1 mm) is still well within the 1 cm position-constraint box used by
  # the planner, so solution quality is unaffected.
  epsilon: 1e-3
